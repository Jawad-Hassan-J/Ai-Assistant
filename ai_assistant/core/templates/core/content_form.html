{% extends 'base.html' %}

{% block content %}
  <div class="page">
    <div class="container">
      <h1>Add a Tool</h1>
      <form action="" method="POST" enctype="multipart/form-data" class="tool-form">
        {% csrf_token %}
        <table>
          {{ form.as_table }}
        </table>
        <input type="submit" value="Submit" class="btn">
      </form>
    </div>
  </div>
{% endblock %}
