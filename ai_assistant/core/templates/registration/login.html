{% extends 'base.html' %}

{% block content %}
  <div class="auth-container">
    <h1>Login</h1>

    {% if form.errors %}
      <p class="error">Invalid username or password</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="submit" class="btn" value="Login">
    </form>
  </div>
{% endblock %}
